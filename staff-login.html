<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAFF LOGIN | EXAM SEAT FINDER</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml, %3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d6efd'/%3E%3Ccircle cx='32' cy='28' r='8' fill='%23ffffff' opacity='0.15'/%3E%3Cpath d='M32 8 L45 16 L45 28 C45 40 39 48 32 53 C25 48 19 40 19 28 L19 16 Z' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='28' r='6' fill='%23dc3545'/%3E%3Ccircle cx='32' cy='28' r='3' fill='%23ffffff'/%3E%3Cpath d='M29 20 L35 20 L35 26 L29 26 Z' fill='%23ffffff' opacity='0.3'/%3E%3C/svg%3E">

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="/css/authentication.css">

</head>

<body class="auth-page">

    <div class="container">
        <div class="auth-container">
            <div class="row g-0">
                <div class="col-lg-5">
                    <div class="auth-brand-panel">
                        <a href="index.html" class="esf-brand-logo">
                            <span class="brand-icon"><i class="bi bi-geo-alt-fill"></i></span>
                            <span class="brand-text">EXAM <strong>SEAT</strong> FINDER</span>
                        </a>
                        <h1 class="mt-4">Staff <span>Portal</span></h1>
                        <p>Secure access for authorized examination staff.</p>
                        <p>Manage student examinations and seat allocations.</p>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="auth-form-panel">
                        <h2><i class="bi bi-person-badge me-2"></i>Staff Login</h2>
                        <p class="text-secondary">Authorized staff only. Please enter your credentials.</p>
                        <form id="staffLoginForm">
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-card-list me-1"></i> Staff ID</label>
                                <input type="text" class="form-control auth-input" id="staffId" placeholder="Enter staff ID" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-envelope me-1"></i> Official University Email</label>
                                <input type="email" class="form-control auth-input" id="staffEmail" placeholder="staff@university.edu" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label"><i class="bi bi-lock-fill me-1"></i> Password</label>
                                <input type="password" class="form-control auth-input" id="staffPassword" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="auth-submit">
                                <i class="bi bi-shield-lock me-2"></i>Continue to 2FA
                            </button>
                        </form>
                        <div id="staffMessage" class="mt-3"></div>
                        <p class="text-center mt-4"><a href="index.html" class="auth-link"><i class="bi bi-house me-1"></i>Back to Home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT SIGN UP | EXAM SEAT FINDER</title>

    <!-- BOOTSTRAP CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!--BOOTSTRAP ICONS -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- STUDENT CSS -->

    <link rel="stylesheet" href="/my project/HTML/css/authentication.css">

    <!-- FAVICON -->

    <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml, %3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CCrect width='64' height='64' rx='14' fill='%230d6efd' /%3e%3Cpath d='M32 9 49 16v14c0 12-7 21-17 26C22 51 15 42 15 30V16z' fill='white'/%3E%3Circle cx='32' cy='30' r='8' fill='%23dc3545'/%3E%3C/svg%3E">

</head>

<body class="auth-page">

    <div class="container">

        <div class="auth-container">

            <div class="roe g-0">

                <div class="col-lg-5">

                    <div class="auth-brand-panel">

                        <div class="esf-logo mb-4">
                            E
                        </div>

                        <h1>
                            
                            Create Your <span>Account</span>

                        </h1>

                        <p class="mt-4">

                            Register your student account to access examination information.

                        </p>

                    </div>

                </div>

                <div class="col-lg-7">

                    <div class="auth-form-panel">

                        <h2>
                            Student Registration
                        </h2>

                        <p class="text-secondary">
                            Create your Exam Seat Finder account.
                        </p>

                        <form id="signForm">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        First Name
                                    </label>

                                    <input type="text" id="firstName" class="form-control auth-input" required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Matriculation Number
                                </label>

                                <input type="text" id="signupMatric" class="form-control auth-input" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Student ID Number
                                </label>

                                <input type="text" id="signupStudentId" class="form-control auth-input" placeholder="E11XXXXX" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input type="text" id="signupEmail" class="form-control auth-input" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="text" class="form-control auth-input" id="signupPasswod" required>

                            </div>

                            <button type="submit" class="auth-submit">

                                Create Account

                            </button>

                        </form>

                        <div id="signupMessage" class="mt-3"></div>

                        <p class="text-center mt-4">

                            Already have an account

                            <a href="login.html" class="auth-link">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

<!-- BOOTSTRAP JS -->
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
</script>

</html>

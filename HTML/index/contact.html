<main class="esf-main">

    <section class="esf-page-header">

        <div class="container">

            <h1>
                Contact Us
            </h1>

            <p>
                Get assistance with your examination information.
            </p>

        </div>

    </section>

    <section class="container py-5">

        <div class="row g-4">

            <div class="col-lg-5">

                <div class="esf-card h-100">

                    <div class="esf-card-header">
                        Contact Information
                    </div>

                    <div class="esf-card-body">

                        <p>
                            <strong>Email:</strong>
                            examseatfinder@university.edu

                        </p>

                        <p>

                            <strong>Phone:</strong>
                            +234 904 586 3014

                        </p>

                        <p>

                            <strong>Office:</strong>
                            Examination Office

                        </p>

                    </div>

                </div>

            </div>

            <div class="col-lg-7">

                <div class="esf-card">

                    <div class="esf-card-body">

                        <h3 class="fw-bold mb-4">
                            Send a Message
                        </h3>

                        <form>

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text" class="form-control" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="text" class="form-control" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Message
                                </label>

                                <textarea class="form-control" rows="5" required></textarea>

                            </div>

                            <button type="submit" class="esf-btn-primary">

                                Send Message

                            </button>

                        </form>

                    </div>

                </div>

            </div>

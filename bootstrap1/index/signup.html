<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT SIGN UP | EXAM SEAT FINDER</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml, %3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d6efd'/%3E%3Ccircle cx='32' cy='28' r='8' fill='%23ffffff' opacity='0.15'/%3E%3Cpath d='M32 8 L45 16 L45 28 C45 40 39 48 32 53 C25 48 19 40 19 28 L19 16 Z' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='28' r='6' fill='%23dc3545'/%3E%3Ccircle cx='32' cy='28' r='3' fill='%23ffffff'/%3E%3Cpath d='M29 20 L35 20 L35 26 L29 26 Z' fill='%23ffffff' opacity='0.3'/%3E%3C/svg%3E">

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="/my project/bootstrap1/css/authentication.css">

</head>

<body class="auth-page">

    <div class="container">
        <div class="auth-container">
            <div class="row g-0">
                <div class="col-lg-5">
                    <div class="auth-brand-panel">
                        <a href="index.html" class="esf-brand-logo">
                            <span class="brand-icon"><i class="bi bi-geo-alt-fill"></i></span>
                            <span class="brand-text">EXAM <strong>SEAT</strong> FINDER</span>
                        </a>
                        <h1 class="mt-4">Create Your <span>Account</span></h1>
                        <p>Register your student account to access examination information.</p>
                        <p>Join thousands of students already using Exam Seat Finder.</p>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="auth-form-panel">
                        <h2>Student Registration</h2>
                        <p class="text-secondary">Create your Exam Seat Finder account.</p>
                        <form id="signupForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="bi bi-person me-1"></i> First Name</label>
                                    <input type="text" id="firstName" class="form-control auth-input" placeholder="Enter first name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="bi bi-person me-1"></i> Last Name</label>
                                    <input type="text" id="lastName" class="form-control auth-input" placeholder="Enter last name" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-card-list me-1"></i> Matriculation Number</label>
                                <input type="text" id="signupMatric" class="form-control auth-input" placeholder="FPS/CSC/23/XXXXX" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-person-badge me-1"></i> Student ID Number</label>
                                <input type="text" id="signupStudentId" class="form-control auth-input" placeholder="E11XXXXX" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-envelope me-1"></i> Email Address</label>
                                <input type="email" id="signupEmail" class="form-control auth-input" placeholder="student@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-lock me-1"></i> Password</label>
                                <input type="password" class="form-control auth-input" id="signupPassword" placeholder="Create a strong password" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label"><i class="bi bi-lock me-1"></i> Confirm Password</label>
                                <input type="password" class="form-control auth-input" id="confirmPassword" placeholder="Confirm your password" required>
                            </div>
                            <button type="submit" class="auth-submit">
                                <i class="bi bi-person-plus me-2"></i>Create Account
                            </button>
                        </form>
                        <div id="signupMessage" class="mt-3"></div>
                        <p class="text-center mt-4">Already have an account? <a href="login.html" class="auth-link">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>

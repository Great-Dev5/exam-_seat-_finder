<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background: #ecf0f3;
        }

        .sidebar{
            position: relative;
            top: 0;
            left: -1000;
            width: 300px;
            height: 100vh;
            background: #ecf0f3;
            padding: 12px;
            box-shadow: -3px -3px 7px #ffffff, 3px 3px 5px #ceced1, inset -3px -3px 7px #ffffff, inset 3px 3px 5px #ceced1;
            transition: all 0.3s ease;
        }

        .sidebar .title{
            display: flex;
            justify-content: space-evenly;
        }

        .sidebar, .title, .logo{
            font-size: 27px;
            font-weight: 600;
            color: #31344b;
        }

        .sidebar ul{
            margin-top: 35px;
            list-style: none;
        }

        .sidebar ul a{
            color: #31344b;
            text-decoration: none;
            display: block;
            margin-top: 12px;
            font-size: 18px;
            font-weight: 800;
            padding: 10px 25px;
            box-shadow: -3px -3px 7px #ffffff;
            border-radius: 6px;
            box-shadow: -3px -3px 7px #ffffff, 3px 3px 5px #ceced1;
            position: relative;
        }

        .sidebar ul i{
            margin-right: 10px;
        }

        .sidebar ul a:hover {
            position: absolute;
            transition: 0.3s;
            box-shadow: -3px -3px 7px #ffffff, inset 3px 3px 5px #ceced1;
        }

        .sidebar ul a:hover:before {
            border-radius: 6px;
        }

        .sidebar ul a:hover{
            color: #3498db;
        }

        label{
            font-size: 17px;
            color: #31344b;
            width: 37px;
            height: 37px;
            text-align: center;
            border-radius: 50%;
            line-height: 37px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: -3px -3px 7px #ffffff, 3px 3px 5px #ceced1;
        }

        .bars{
            position: absolute;
            left: 15px;
            top: 15px;
        }

        .label:hover{
            box-shadow: -3px -3px 7px #ffffff, 3px 3px 5px #ceced1;;
        }
    </style>
</head>
<body>
    
    <input type="checkbox" id="check">

    <label for="check" class="button bars"><i class="fas fa-bars"></i></label>

    <div class="sidebar">

        <div class="title">

            <div class="logo"Exam Seat Finder></div>

            <label for="check" class="button cancle"><i class="fas fa-times"></i></label>
        </div>

        <ul>

            <li>

                <a href="">

                    <i class="fas fa-qrcode">Dashboard</i>
                </a>

            </li>

            <li>
                
                <a href="">

                    <i class="fas fa-link">Shortcuts</i>
                </a>

            </li>

            <li>
                
                <a href="">

                    <i class="fas fa-stream">Overview</i>
                </a>

            </li>

            <li>

                <a href="">

                    <i class="fas fa-Calendar">Events</i>
                </a>

            </li>

            <li>

                <a href="">

                    <i class="fas fa-question">About</i>
                </a>

            </li>

            <li>

                <a href="">

                    <i class="fas fa-sliders">Services</i>
                </a>

            </li>

            <li>

                <a href="">

                    <i class="fas fa-phone-volume">Contact</i>
                </a>

            </li>

            <li>

                <a href="">

                    <i class="fas fa-comments">Feedback</i>
                </a>

            </li>

        </ul>


    </div>

</body>
</html>
